name: daily-archive

# 纯云端班次边界归档: 不依赖任何开发机/数据端开机
# 白班在泰国 20:20–20:29 归档，夜班在次日 07:50–07:59 归档。
# 两个不可变班次记录齐全后，才物化对应生产日，避免跨日和延迟任务串档。
on:
  # 数据驱动归档：脚本按当前源数据的完整性决定归档哪班，不再依赖窄窗口。
  # GitHub Actions 的 schedule 调度在实际时钟上不可靠（实测曾偏离数小时），
  # 因此改为每 30 分钟触发一次，确保白班(20:20后)和夜班(次日07:50后)完成时
  # 有一次运行能落在其后，自愈补档。频繁只读 Firebase + 仅在新完整班次出现时
  # 才写文件，成本可忽略。
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      shift:
        description: "归档班次；auto 自动归档当前已完成的班次，day/night 强制指定"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - day
          - night

permissions:
  contents: write

concurrency:
  group: daily-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run shift-boundary archive
        run: python3 scripts/archive_daily.py --shift "${{ inputs.shift || 'auto' }}"
      - name: Validate history analytics
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "no change, skip push"
          else
            git commit -m "archive: 班次边界快照 $(TZ=Asia/Bangkok date +%F)"
            git pull --rebase origin main
            git push origin main
          fi
