name: deploy-cloudflare-pages

# 2026-11-04 新增：把看板自动发布到 Cloudflare Pages（替代人工上传）
#
# 背景：gat-production-dashboard.pages.dev 之前的更新是人工上传的快照，
#   仓库再改也不会自动上线 → 线上长期停在旧版本（实测停在 2026-11-03 15:33 的代码），
#   于是「新链接的数据和旧链接/实际生产对不上」。
#
# 生效前提（一次性，2 个仓库都要加同样的两个 Secret）：
#   CLOUDFLARE_API_TOKEN   — Cloudflare → My Profile → API Tokens → 创建
#                            模板选「Edit Cloudflare Workers」或自建：
#                            Account: Cloudflare Pages:Edit, Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 控制台右下角 Account ID
# 没有 Secret 时整个 job 直接跳过（不会红），推送历史数据也不会触发。

on:
  push:
    branches: [main]
    paths-ignore:
      - "history/**"
      - "logs/**"
      - "**/*.md"
      - "**.bak*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检查 Secret 是否已配置
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，本次跳过部署"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version: "20"

      - name: 组装发布目录（剔除开发/备份/日志）
        if: steps.guard.outputs.skip == 'false'
        run: |
          mkdir -p dist
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'logs' --exclude 'tools' \
            --exclude 'scripts' --exclude 'server' --exclude 'tests' \
            --exclude '_*' --exclude '*.bak*' --exclude '*.log' \
            ./ dist/
          ls -la dist | head -30

      - name: 发布到 Cloudflare Pages
        if: steps.guard.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 按仓库决定目标项目：pdtiii-live → 电脑端，pdtiii-mobile → 手机端
          if [ "$GITHUB_REPOSITORY" = "wlp713/pdtiii-mobile" ]; then
            PROJECT=gat-production-dashboard-mobile
          else
            PROJECT=gat-production-dashboard
          fi
          echo "deploy -> $PROJECT"
          npx --yes wrangler@3 pages deploy dist \
            --project-name="$PROJECT" \
            --branch=main --commit-dirty=true
