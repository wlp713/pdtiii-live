<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>两小时检讨会 · PRO2 FINAL</title>
<link rel="icon" type="image/png" href="icon-192.png">
<!-- 两小时检讨会大屏（2026-11-19）
     数据：DM 后台每分钟算好写到同一个实时库 /dm_meeting/PRO2（作业长手机填的 LOSS 问题点 + PRO2 未关闭异常单 + 看板逐小时产出）
     本页 30 秒读一次；5 分钟没更新标红。不依赖 index.html 的任何脚本。 -->
<style>
  :root {
    --bg: #000; --panel: #121215; --panel2: #18181c; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.16);
    --ink: #f4f4f5; --ink2: #a1a1aa; --ink3: #71717a;
    --ok: #10b981; --warn: #f59e0b; --bad: #ef4444; --acc: #3b82f6;
    --bad-bg: rgba(239,68,68,.14); --warn-bg: rgba(245,158,11,.14); --ok-bg: rgba(16,185,129,.12); --acc-bg: rgba(59,130,246,.14);
    font-size: min(1vw, 1.78vh);   /* 1rem ≈ 19px @1080p，整页随屏幕等比 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Inter", -apple-system, "Segoe UI", "Microsoft YaHei", "Leelawadee UI", "Tahoma", sans-serif; }
  body { display: flex; flex-direction: column; padding: .8rem 1rem; gap: .7rem; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  /* 顶栏 */
  .top { display: flex; align-items: center; gap: 1rem; flex: none; }
  .back { display: inline-flex; align-items: center; gap: .3rem; height: 2.4rem; padding: 0 .9rem; border: 1px solid var(--line2); border-radius: .6rem; color: var(--ink2); font-size: 1rem; text-decoration: none; }
  .back:hover, .seg button:hover { color: var(--ink); border-color: var(--ink3); }
  h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: .02em; }
  h1 small { font-size: 1.1rem; font-weight: 500; color: var(--ink2); margin-left: .6rem; }
  .sp { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: .6rem; overflow: hidden; }
  .seg button { height: 2.4rem; padding: 0 .9rem; font-size: 1rem; color: var(--ink2); }
  .seg button.on { background: var(--ink); color: #000; font-weight: 600; }
  .fresh { display: inline-flex; align-items: center; gap: .4rem; font-size: 1rem; color: var(--ink2); }
  .fresh i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--ok); }
  .fresh.stale { color: var(--bad); } .fresh.stale i { background: var(--bad); animation: blink 1s infinite; }
  .clock { font-size: 1.7rem; font-weight: 600; min-width: 5.5rem; text-align: right; }
  @keyframes blink { 50% { opacity: .25; } }

  /* 四条线 + 合计 */
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: .7rem; flex: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: .9rem; padding: .8rem 1rem; text-align: left; position: relative; }
  .card.sel { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
  .card.dim { opacity: .45; }
  .card .nm { font-size: 1.15rem; font-weight: 700; color: var(--ink2); letter-spacing: .04em; }
  .card .row { display: flex; align-items: baseline; justify-content: space-between; margin-top: .3rem; }
  .card .act { font-size: 2.6rem; font-weight: 700; line-height: 1.1; }
  .card .pl { font-size: 1.2rem; color: var(--ink3); }
  .card .rate { font-size: 1.5rem; font-weight: 700; }
  .card .loss { display: flex; gap: .5rem; margin-top: .45rem; font-size: 1.05rem; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: .25rem; padding: .12rem .5rem; border-radius: .4rem; font-weight: 600; white-space: nowrap; }
  .chip.bad { background: var(--bad-bg); color: #fca5a5; }
  .chip.warn { background: var(--warn-bg); color: #fcd34d; }
  .chip.ok { background: var(--ok-bg); color: #6ee7b7; }
  .chip.acc { background: var(--acc-bg); color: #93c5fd; }
  .chip.mut { background: rgba(255,255,255,.06); color: var(--ink2); }
  .c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-bad { color: var(--bad); }

  /* 逐小时矩阵 */
  .grid { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: .9rem; padding: .5rem .7rem .6rem; }
  table { width: 100%; border-collapse: separate; border-spacing: .3rem; table-layout: fixed; }
  th { font-size: 1rem; font-weight: 600; color: var(--ink3); padding: .15rem 0; }
  th.win { color: var(--ink); }
  th.win::after { content: ""; display: block; height: 3px; margin: .25rem .4rem 0; border-radius: 2px; background: var(--acc); }
  th.ln, td.ln { width: 7.5rem; text-align: left; font-size: 1.1rem; font-weight: 700; color: var(--ink2); }
  th.sum, td.sum { width: 7.5rem; }
  td.h { height: 4.2rem; border-radius: .55rem; background: var(--panel2); text-align: center; vertical-align: middle; position: relative; border: 1px solid transparent; }
  td.h .a { font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
  td.h .p { font-size: .9rem; color: var(--ink3); }
  td.h .l { position: absolute; top: .25rem; right: .3rem; font-size: .85rem; font-weight: 700; color: #fca5a5; }
  td.h .mk { position: absolute; left: .3rem; top: .2rem; font-size: .85rem; font-weight: 800; }
  td.h.loss1 { background: var(--warn-bg); }
  td.h.loss2 { background: var(--bad-bg); }
  td.h.win { border-color: rgba(59,130,246,.45); }
  td.h.cur { border: 1px dashed var(--acc); }
  td.h.todo { background: transparent; border: 1px dashed var(--line); color: var(--ink3); }
  td.h.off { opacity: .4; }
  td.h.dim { opacity: .3; }
  td.sum { text-align: right; padding-right: .4rem; }
  td.sum b { font-size: 1.45rem; color: #fca5a5; }
  td.sum span { display: block; font-size: .9rem; color: var(--ink3); }
  tr.dimr td { opacity: .35; }

  /* 下方两栏 */
  .low { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.45fr 1fr; gap: .7rem; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: .9rem; display: flex; flex-direction: column; min-height: 0; }
  .ph { display: flex; align-items: center; gap: .6rem; padding: .7rem 1rem .5rem; flex: none; }
  .ph h2 { font-size: 1.3rem; font-weight: 700; }
  .ph .cnt { font-size: 1.1rem; color: var(--ink3); font-weight: 600; }
  .list { overflow-y: auto; padding: 0 .7rem .7rem; flex: 1; min-height: 0; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .it { display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .8rem; padding: .65rem .5rem; border-top: 1px solid var(--line); align-items: start; }
  .it:first-child { border-top: 0; }
  .it .lt { display: flex; flex-direction: column; gap: .3rem; align-items: flex-start; min-width: 6rem; }
  .tag { font-size: .95rem; font-weight: 700; padding: .1rem .45rem; border-radius: .35rem; background: rgba(255,255,255,.08); color: var(--ink); letter-spacing: .03em; }
  .hr { font-size: .95rem; color: var(--ink3); }
  .tx { font-size: 1.2rem; line-height: 1.35; overflow-wrap: anywhere; }
  .tx2 { font-size: .98rem; color: var(--ink3); margin-top: .15rem; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .35rem; font-size: .95rem; }
  .q { font-size: 1.9rem; font-weight: 800; color: #fca5a5; text-align: right; line-height: 1; }
  .q small { display: block; font-size: .85rem; font-weight: 500; color: var(--ink3); margin-top: .2rem; }
  .it.gap .tx { color: #fcd34d; }
  .it.new { background: linear-gradient(90deg, rgba(59,130,246,.14), transparent 60%); border-radius: .5rem; }
  .no { font-size: .9rem; color: var(--ink3); }
  .empty { display: flex; align-items: center; justify-content: center; height: 100%; min-height: 6rem; color: var(--ink3); font-size: 1.2rem; }
  .lv { font-size: 1.05rem; font-weight: 800; padding: .1rem .45rem; border-radius: .35rem; background: var(--bad); color: #fff; }
  .ago { font-size: .95rem; color: var(--ink3); text-align: right; white-space: nowrap; }

  .banner { flex: none; display: none; padding: .45rem 1rem; border-radius: .6rem; background: var(--bad-bg); color: #fca5a5; font-size: 1.05rem; font-weight: 600; }
  .banner.show { display: block; }
</style>
</head>
<body>
<header class="top">
  <a class="back" href="index.html" id="backBtn">‹ <span data-k="back"></span></a>
  <h1><span data-k="title"></span><small id="sub"></small></h1>
  <div class="sp"></div>
  <div class="seg" id="scopeSeg"><button data-v="win" data-k="scopeWin"></button><button data-v="all" data-k="scopeAll"></button></div>
  <div class="seg" id="langSeg"><button data-v="zh">中文</button><button data-v="th">ไทย</button></div>
  <span class="fresh" id="fresh"><i></i><span></span></span>
  <span class="clock num" id="clock"></span>
</header>
<div class="banner" id="banner"></div>
<section class="cards" id="cards"></section>
<section class="grid"><table id="tbl"></table></section>
<section class="low">
  <div class="pane">
    <div class="ph"><h2 data-k="probs"></h2><span class="cnt num" id="probCnt"></span></div>
    <div class="list" id="probs"></div>
  </div>
  <div class="pane">
    <div class="ph"><h2 data-k="issues"></h2><span class="cnt num" id="issCnt"></span></div>
    <div class="list" id="issues"></div>
  </div>
</section>
<script>
(function () {
  "use strict";
  var DB = "https://dm111-e8a7d-default-rtdb.firebaseio.com/dm_meeting/PRO2.json";
  var qs = new URLSearchParams(location.search);
  var SRC = qs.get("src") || DB;            // ?src= 仅供本地测试样例数据
  var POLL = 30000, STALE = 5 * 60000;
  var T = {
    zh: { title: "两小时检讨会", back: "生产看板", scopeWin: "本次检讨", scopeAll: "全班", probs: "问题点", issues: "升级问题",
      day: "白班", night: "夜班", total: "合计", plan: "计划", loss: "LOSS", unexp: "未说明", ok: "已说明",
      noProb: "这段时间没有 LOSS", noIss: "没有未关闭的问题", gapTx: "有 LOSS 未填原因", gapRep: "未填报",
      upd: "更新", stale: "数据超过 5 分钟没更新，请检查网络或 DM 后台", loading: "正在读取…", fail: "读取失败，30 秒后重试",
      open: "待接单", doing: "处理中", verify: "待确认", over: "超时", fresh: "新", min: "分钟前", hr: "小时前", unit: "台",
      brk: "午休", winOf: "检讨" },
    th: { title: "ประชุมทบทวนทุก 2 ชม.", back: "บอร์ดการผลิต", scopeWin: "รอบนี้", scopeAll: "ทั้งกะ", probs: "ปัญหา", issues: "ปัญหาที่ยกระดับ",
      day: "กะเช้า", night: "กะดึก", total: "รวม", plan: "แผน", loss: "LOSS", unexp: "ยังไม่ระบุ", ok: "ระบุแล้ว",
      noProb: "ช่วงนี้ไม่มี LOSS", noIss: "ไม่มีปัญหาค้าง", gapTx: "มี LOSS แต่ยังไม่ระบุสาเหตุ", gapRep: "ยังไม่กรอก",
      upd: "อัปเดต", stale: "ข้อมูลไม่อัปเดตเกิน 5 นาที กรุณาตรวจสอบเครือข่ายหรือระบบ DM", loading: "กำลังโหลด…", fail: "โหลดไม่สำเร็จ จะลองใหม่ใน 30 วินาที",
      open: "รอรับงาน", doing: "กำลังแก้ไข", verify: "รอยืนยัน", over: "เกินเวลา", fresh: "ใหม่", min: "นาทีที่แล้ว", hr: "ชม.ที่แล้ว", unit: "เครื่อง",
      brk: "พักเที่ยง", winOf: "ทบทวน" }
  };
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var st = { lang: qs.get("lang") || store("mtg_lang") || "zh", scope: store("mtg_scope") || "win", line: "", d: null, err: false, fetchedAt: 0 };
  if (!T[st.lang]) st.lang = "zh";
  function t(k) { return T[st.lang][k]; }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function n0(x) { return Math.round(Number(x) || 0).toLocaleString("en-US"); }
  function nm(o) { return o ? (o[st.lang] || o.zh || "") : ""; }
  function short(name) { return String(name || "").replace(/\s*line$/i, "").toUpperCase(); }
  /* 泰国时间：大屏电脑时区可能没设对，一律按 UTC+7 显示 */
  function bkk(ts) { return new Date(ts + 7 * 3600000); }
  function hhmm(ts) { var d = bkk(ts); return ("0" + d.getUTCHours()).slice(-2) + ":" + ("0" + d.getUTCMinutes()).slice(-2); }
  function arr(x) { return Array.isArray(x) ? x.filter(Boolean) : x && typeof x === "object" ? Object.keys(x).map(function (k) { return x[k]; }) : []; }

  /* 本次检讨覆盖的小时：最近一次会（过去 60 分钟内开始的）或下一次会，到上一次会之间的已开工小时 */
  function windowHours(d) {
    var hours = arr(d.hours), slots = arr(d.slots).map(function (s) { var p = String(s.time).split(":"); return +p[0] * 60 + (+p[1] || 0); });
    if (!slots.length) return hours;
    var night = d.shift === "NIGHT";
    var rel = function (m) { return night && m < 20 * 60 ? m + 1440 : m; };   // 夜班跨零点：按开班后分钟比较
    var nowD = bkk(Date.now()), nowM = rel(nowD.getUTCHours() * 60 + nowD.getUTCMinutes());
    var ss = slots.map(rel).sort(function (a, b) { return a - b; });
    var meet = null;
    for (var i = 0; i < ss.length; i++) if (ss[i] <= nowM && nowM - ss[i] < 60) meet = i;
    if (meet == null) for (var j = 0; j < ss.length; j++) if (ss[j] > nowM) { meet = j; break; }
    if (meet == null) return hours.filter(function (h) { return rel(h * 60) >= ss[ss.length - 1]; });   // 最后一次会之后：看到下班为止
    var from = meet > 0 ? ss[meet - 1] : (night ? 20 * 60 : 8 * 60), to = ss[meet];
    return hours.filter(function (h) { var m = rel(h * 60); return m >= from && m < to; });
  }

  function render() {
    document.documentElement.lang = st.lang === "th" ? "th" : "zh-CN";
    document.querySelectorAll("[data-k]").forEach(function (el) { el.textContent = t(el.getAttribute("data-k")); });
    document.title = t("title") + " · PRO2 FINAL";
    document.querySelectorAll("#langSeg button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === st.lang); });
    document.querySelectorAll("#scopeSeg button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === st.scope); });
    var d = st.d;
    var fr = $("fresh"), stale = d && Date.now() - d.at > STALE;
    fr.classList.toggle("stale", !!(stale || st.err));
    fr.lastChild.textContent = d ? t("upd") + " " + hhmm(d.at) : t(st.err ? "fail" : "loading");
    $("banner").textContent = st.err && d ? t("fail") : t("stale");
    $("banner").classList.toggle("show", !!(d && (stale || st.err)));
    if (!d) return;
    var hours = arr(d.hours), win = windowHours(d), lines = arr(d.lines);
    var scopeH = st.scope === "win" && win.length ? win : hours;
    var inScope = function (h) { return scopeH.indexOf(h) >= 0; };
    $("sub").textContent = "PRO2 FINAL · " + d.date + " " + t(d.shift === "NIGHT" ? "night" : "day") + (win.length ? " · " + t("winOf") + " " + win[0] + ":00–" + ((win[win.length - 1] + 1) % 24) + ":00" : "");

    /* 卡片：按当前范围（本次检讨 / 全班）汇总 */
    var tot = { p: 0, a: 0, l: 0, q: 0 };
    var sums = lines.map(function (ln) {
      var s = { p: 0, a: 0, l: 0, q: 0 };
      arr(ln.h).forEach(function (h) { if (!inScope(h.hour)) return; s.p += h.p || 0; s.a += h.a || 0; s.l += h.l || 0; s.q += h.q || 0; });
      tot.p += s.p; tot.a += s.a; tot.l += s.l; tot.q += s.q;
      return s;
    });
    function card(name, s, key) {
      var rate = s.p > 0 ? Math.round(s.a / s.p * 100) : null;
      var rc = rate == null ? "" : rate >= 95 ? "c-ok" : rate >= 85 ? "c-warn" : "c-bad";
      var gap = Math.max(0, Math.round(s.l - s.q));
      var sel = key != null && st.line === key, dim = key != null && st.line && !sel;
      return '<button class="card' + (sel ? " sel" : "") + (dim ? " dim" : "") + '"' + (key != null ? ' data-line="' + esc(key) + '"' : ' data-line=""') + '>' +
        '<div class="nm">' + esc(name) + '</div>' +
        '<div class="row"><span><span class="act num">' + n0(s.a) + '</span> <span class="pl num">/ ' + n0(s.p) + '</span></span><span class="rate num ' + rc + '">' + (rate == null ? "—" : rate + "%") + '</span></div>' +
        '<div class="loss">' + (s.l > 0 ? '<span class="chip bad num">' + t("loss") + " " + n0(s.l) + '</span>' + (gap > 0 ? '<span class="chip warn num">' + t("unexp") + " " + n0(gap) + '</span>' : '<span class="chip ok">' + t("ok") + '</span>') : '<span class="chip ok">' + t("loss") + ' 0</span>') + '</div></button>';
    }
    $("cards").innerHTML = lines.map(function (ln, i) { return card(short(ln.name), sums[i], ln.key); }).join("") + card(t("total"), tot, null);

    /* 矩阵 */
    var head = '<tr><th class="ln"></th>' + hours.map(function (h) { return '<th class="num' + (win.indexOf(h) >= 0 ? " win" : "") + '">' + h + ':00</th>'; }).join("") + '<th class="sum">' + t("loss") + '</th></tr>';
    var body = lines.map(function (ln, i) {
      var hm = {}; arr(ln.h).forEach(function (h) { hm[h.hour] = h; });
      var cells = hours.map(function (hr) {
        var h = hm[hr] || { hour: hr, st: "todo" }, cls = ["h"], inner = "";
        if (win.indexOf(hr) >= 0) cls.push("win");
        if (st.scope === "win" && win.length && !inScope(hr)) cls.push("dim");
        if (h.st === "todo") { cls.push("todo"); inner = "—"; }
        else {
          if (h.st === "cur") cls.push("cur");
          if (h.off) cls.push("off");
          var l = h.l || 0, p = h.p || 0;
          if (l > 0) cls.push(p > 0 && l / p >= 0.1 ? "loss2" : "loss1");
          inner = '<div class="a num">' + (h.a != null ? n0(h.a) : "—") + '</div><div class="p num">' + (h.p != null ? n0(h.p) : "") + '</div>' + (l > 0 ? '<span class="l num">−' + n0(l) + '</span>' : "");
          /* 已结束的小时：有 LOSS 但没说明清楚 → 黄色「!」；说明了 → 绿色「✓」 */
          if (h.st === "done" && l > 0) inner += (h.q || 0) >= l ? '<span class="mk c-ok">✓</span>' : '<span class="mk c-warn">!</span>';
        }
        return '<td class="' + cls.join(" ") + '">' + inner + '</td>';
      }).join("");
      var dim = st.line && st.line !== ln.key;
      return '<tr' + (dim ? ' class="dimr"' : "") + '><td class="ln">' + esc(short(ln.name)) + '</td>' + cells +
        '<td class="sum"><b class="num">' + n0(ln.loss) + '</b><span class="num">' + t("unexp") + " " + n0(Math.max(0, ln.loss - (ln.attr || 0))) + '</span></td></tr>';
    }).join("");
    $("tbl").innerHTML = head + body;

    /* 问题点：作业长填的 + 有 LOSS 没填原因的小时 */
    var lineName = {}; lines.forEach(function (ln) { lineName[ln.key] = short(ln.name); });
    var okLine = function (k) { return !st.line || st.line === k; };
    var rows = arr(d.probs).filter(function (p) { return inScope(p.hour) && okLine(p.line); }).map(function (p) {
      var main = st.lang === "zh" ? (p.zh || p.text) : (p.text || p.zh), sub = st.lang === "zh" && p.zh && p.text && p.zh !== p.text ? p.text : "";
      return { g: 0, qty: p.qty || 0, hour: p.hour, html: '<div class="it"><div class="lt"><span class="tag">' + esc(lineName[p.line] || p.line) + '</span><span class="hr num">' + p.hour + ':00</span></div>' +
        '<div><div class="tx">' + esc(main || nm(p.t)) + '</div>' + (sub ? '<div class="tx2">' + esc(sub) + '</div>' : "") +
        '<div class="meta"><span class="chip mut">' + esc(nm(p.t)) + '</span>' + (p.d ? '<span class="chip acc">' + esc(nm(p.d)) + '</span>' : "") + (p.equip ? '<span class="chip mut">' + esc(p.equip) + '</span>' : "") + '</div></div>' +
        '<div class="q num">' + (p.qty ? n0(p.qty) + '<small>' + t("unit") + '</small>' : "") + '</div></div>' };
    });
    lines.forEach(function (ln) {
      if (!okLine(ln.key)) return;
      arr(ln.h).forEach(function (h) {
        if (h.st !== "done" || !inScope(h.hour)) return;
        var gap = Math.round((h.l || 0) - (h.q || 0));
        if (gap <= 0) return;
        rows.push({ g: 1, qty: gap, hour: h.hour, html: '<div class="it gap"><div class="lt"><span class="tag">' + esc(short(ln.name)) + '</span><span class="hr num">' + h.hour + ':00</span></div>' +
          '<div><div class="tx">' + t("gapTx") + '</div><div class="meta"><span class="chip warn">' + t(h.rep ? "unexp" : "gapRep") + '</span></div></div>' +
          '<div class="q num" style="color:#fcd34d">' + n0(gap) + '<small>' + t("unit") + '</small></div></div>' });
      });
    });
    rows.sort(function (a, b) { return a.g - b.g || b.qty - a.qty || hours.indexOf(b.hour) - hours.indexOf(a.hour); });   // 填了原因的按台数在前，没填原因的排后面
    $("probs").innerHTML = rows.length ? rows.map(function (r) { return r.html; }).join("") : '<div class="empty">' + t("noProb") + '</div>';
    $("probCnt").textContent = rows.length ? rows.length : "";

    /* 升级问题：PRO2 未关闭异常单（升级级别 → 超时 → 新的在前，后台已排好） */
    var iss = arr(d.issues).filter(function (i) { return !st.line || i.line === st.line || !i.line; });
    $("issues").innerHTML = iss.length ? iss.map(function (i) {
      var age = Math.max(0, Date.now() - (i.at || 0)), isNew = age < 15 * 60000;
      var ago = age < 3600000 ? Math.max(1, Math.round(age / 60000)) + " " + t("min") : Math.round(age / 3600000) + " " + t("hr");
      var stc = i.status === "open" ? "warn" : i.status === "verify" ? "ok" : "acc";
      return '<div class="it' + (isNew ? " new" : "") + '"><div class="lt">' + (i.line ? '<span class="tag">' + esc(lineName[i.line]) + '</span>' : (i.lineName ? '<span class="tag">' + esc(short(i.lineName)) + '</span>' : "")) +
        (i.esc ? '<span class="lv">L' + i.esc + '</span>' : "") + '</div>' +
        '<div><div class="tx">' + esc(i.title || i.note || nm(i.t)) + '</div>' + (i.title && i.note && i.note !== i.title ? '<div class="tx2">' + esc(i.note) + '</div>' : "") +
        '<div class="meta"><span class="chip ' + stc + '">' + t(i.status) + '</span>' + (i.over ? '<span class="chip bad">' + t("over") + '</span>' : "") + '<span class="chip acc">' + esc(nm(i.d)) + '</span>' + (isNew ? '<span class="chip acc">' + t("fresh") + '</span>' : "") + '</div></div>' +
        '<div class="ago"><div class="num">' + ago + '</div><div class="no num">' + esc(i.no) + '</div></div></div>';
    }).join("") : '<div class="empty">' + t("noIss") + '</div>';
    $("issCnt").textContent = iss.length ? iss.length : "";
  }

  function load() {
    fetch(SRC + (SRC.indexOf("?") >= 0 ? "&" : "?") + "_=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (j) { if (j && j.lines) { st.d = j; st.err = false; } else st.err = true; render(); })
      .catch(function () { st.err = true; render(); });
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.parentNode.id === "langSeg") { st.lang = b.dataset.v; store("mtg_lang", st.lang); }
    else if (b.parentNode.id === "scopeSeg") { st.scope = b.dataset.v; store("mtg_scope", st.scope); }
    else if (b.dataset.line != null) st.line = st.line === b.dataset.line ? "" : b.dataset.line;
    else return;
    render();
  });
  function tickClock() { $("clock").textContent = hhmm(Date.now()); }
  tickClock(); setInterval(tickClock, 10000);
  render(); load();
  setInterval(load, POLL);
  setInterval(render, 60000);   // 「本次检讨」时段 / 超时 / 几分钟前随时间走
})();
</script>
</body>
</html>
